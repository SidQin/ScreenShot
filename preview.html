<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>截图预览 - ScreenShot</title>
  <link rel="icon" type="image/png" sizes="48x48" href="images/icon48.png">
  <link rel="icon" type="image/png" sizes="128x128" href="images/icon128.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* ── 工具栏 ── */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10,10,15,0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .toolbar.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.01em;
    }

    .toolbar-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      height: 32px;
      padding: 0 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .tool-btn:hover { transform: scale(1.04); }

    .btn-download {
      background: linear-gradient(135deg, rgba(102,126,234,0.9), rgba(118,75,162,0.9));
      color: white;
      box-shadow: 0 2px 10px rgba(102,126,234,0.35);
    }

    .btn-download:hover {
      background: linear-gradient(135deg, rgba(112,136,244,1), rgba(128,85,172,1));
    }

    .btn-copy {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .btn-copy:hover { background: rgba(255,255,255,0.18); }

    .btn-close {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-close:hover {
      background: rgba(255,59,48,0.5);
      color: white;
      border-color: rgba(255,59,48,0.4);
    }

    /* ── 缩放控件 ── */
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 2px;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .zoom-btn:hover { background: rgba(255,255,255,0.12); color: white; }

    .zoom-label {
      min-width: 42px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      font-variant-numeric: tabular-nums;
    }

    /* ── 图片容器 ── */
    .canvas-area {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 68px 20px 20px;
      cursor: grab;
    }

    .canvas-area.dragging {
      cursor: grabbing;
    }

    .canvas-area::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .canvas-area::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
    }

    .canvas-area::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 4px;
    }

    .canvas-area::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.3);
    }

    #main-img {
      display: block;
      max-width: none;
      transform-origin: top center;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      transition: transform 0.15s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
      opacity: 0;
    }

    #main-img.loaded { opacity: 1; }

    /* ── 加载中 ── */
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: rgba(102,126,234,0.9);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading.hidden { display: none; }

    /* ── 错误 ── */
    .error-msg {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }

    .error-msg.show { display: flex; }
    .error-icon { font-size: 36px; }

    /* ── 操作反馈 toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,40,0.92);
      color: rgba(255,255,255,0.9);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- 工具栏 -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-left">
      <span class="toolbar-title">📸 截图预览</span>
      <span class="toolbar-hint" id="img-size-hint"></span>
    </div>
    <div class="toolbar-right">
      <!-- 缩放控件 -->
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-out" title="缩小 (-)">−</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button class="zoom-btn" id="zoom-in" title="放大 (+)">+</button>
        <button class="zoom-btn" id="zoom-fit" title="适应窗口 (F)">⊡</button>
      </div>
      <button class="tool-btn btn-copy" id="btn-copy">📋 复制</button>
      <button class="tool-btn btn-download" id="btn-download">📥 下载</button>
      <button class="tool-btn btn-close" id="btn-close">✕ 关闭</button>
    </div>
  </div>

  <!-- 图片区域 -->
  <div class="canvas-area" id="canvas-area">
    <img id="main-img" src="" alt="截图" draggable="false" />
  </div>

  <!-- 加载中 -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>加载截图中…</span>
  </div>

  <!-- 错误 -->
  <div class="error-msg" id="error-msg">
    <span class="error-icon">🙁</span>
    <span>截图数据不存在，请重新截图</span>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const DB_NAME    = 'ScreenShotDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'screenshots';
    const KEY        = 'preview_image';

    const mainImg    = document.getElementById('main-img');
    const loading    = document.getElementById('loading');
    const errorMsg   = document.getElementById('error-msg');
    const toolbar    = document.getElementById('toolbar');
    const zoomLabel  = document.getElementById('zoom-label');
    const imgSizeHint = document.getElementById('img-size-hint');
    const canvasArea = document.getElementById('canvas-area');
    const toast      = document.getElementById('toast');

    let currentZoom = 1;
    let imgDataUrl  = null;
    let toolbarTimer = null;

    /* ── IDB 读取 ── */
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function readFromIDB() {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const r  = tx.objectStore(STORE_NAME).get(KEY);
        r.onsuccess = () => res(r.result || null);
        r.onerror   = () => rej(r.error);
      });
    }

    /* 最多重试 20 次，每次间隔 150ms（等 popup 写完 IDB） */
    async function loadImage() {
      const MAX_RETRY = 20;
      const INTERVAL  = 150;

      for (let i = 0; i < MAX_RETRY; i++) {
        try {
          const data = await readFromIDB();
          if (data) {
            imgDataUrl = data;
            mainImg.onload = () => {
              loading.classList.add('hidden');
              mainImg.classList.add('loaded');
              imgSizeHint.textContent = `${mainImg.naturalWidth} × ${mainImg.naturalHeight} px`;
              fitToWindow();
            };
            mainImg.src = imgDataUrl;
            return; /* 成功，退出 */
          }
        } catch (err) {
          console.warn('IDB 读取出错，重试…', err);
        }
        /* 等一会儿再试 */
        await new Promise(r => setTimeout(r, INTERVAL));
      }

      /* 重试耗尽，显示错误 */
      loading.classList.add('hidden');
      errorMsg.classList.add('show');
    }

    /* ── 缩放 ── */
    function setZoom(z) {
      currentZoom = Math.min(4, Math.max(0.1, z));
      mainImg.style.transform = `scale(${currentZoom})`;
      mainImg.style.transformOrigin = 'top center';
      /* 调整容器 padding 以给缩放后的图片留空间 */
      const scaledH = mainImg.naturalHeight * currentZoom;
      canvasArea.style.paddingBottom = Math.max(20, scaledH - mainImg.naturalHeight + 40) + 'px';
      zoomLabel.textContent = Math.round(currentZoom * 100) + '%';
    }

    function fitToWindow() {
      const availW = window.innerWidth - 40;
      const availH = window.innerHeight - 88;
      const scaleW = availW / mainImg.naturalWidth;
      const scaleH = availH / mainImg.naturalHeight;
      setZoom(Math.min(scaleW, scaleH, 1));
    }

    document.getElementById('zoom-in').addEventListener('click', () => setZoom(currentZoom * 1.25));
    document.getElementById('zoom-out').addEventListener('click', () => setZoom(currentZoom / 1.25));
    document.getElementById('zoom-fit').addEventListener('click', fitToWindow);

    /* 滚轮缩放 */
    canvasArea.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        setZoom(currentZoom * delta);
      }
    }, { passive: false });

    /* 键盘快捷键 */
    document.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=') setZoom(currentZoom * 1.25);
      if (e.key === '-')                   setZoom(currentZoom / 1.25);
      if (e.key === 'f' || e.key === 'F') fitToWindow();
      if (e.key === '0')                   setZoom(1);
      if (e.key === 'Escape')              window.close();
    });

    /* 双击切换 100% / 适应窗口 */
    mainImg.addEventListener('dblclick', () => {
      if (Math.abs(currentZoom - 1) < 0.05) {
        fitToWindow();
      } else {
        setZoom(1);
      }
    });

    /* ── 工具栏自动隐藏 ── */
    function showToolbar() {
      toolbar.classList.remove('hidden');
      clearTimeout(toolbarTimer);
      toolbarTimer = setTimeout(() => {
        toolbar.classList.add('hidden');
      }, 3000);
    }

    document.addEventListener('mousemove', showToolbar);
    toolbar.addEventListener('mouseenter', () => {
      clearTimeout(toolbarTimer);
      toolbar.classList.remove('hidden');
    });

    /* ── Toast ── */
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ── 下载 ── */
    document.getElementById('btn-download').addEventListener('click', () => {
      if (!imgDataUrl) return;
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const a = document.createElement('a');
      a.href = imgDataUrl;
      a.download = `screenshot-${ts}.png`;
      a.click();
      showToast('✅ 已下载');
    });

    /* ── 复制 ── */
    document.getElementById('btn-copy').addEventListener('click', async () => {
      if (!imgDataUrl) return;
      try {
        const res  = await fetch(imgDataUrl);
        const blob = await res.blob();
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showToast('✅ 已复制到剪切板');
      } catch (err) {
        showToast('❌ 复制失败');
      }
    });

    /* ── 关闭 ── */
    document.getElementById('btn-close').addEventListener('click', () => window.close());

    /* 启动 */
    loadImage();
  </script>
</body>
</html>
